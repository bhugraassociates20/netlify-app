        <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous photo"><i class="fas fa-chevron-left"></i></button>
        <figure class="lightbox-figure">
            <img src="" alt="" id="lightboxImage">
            <figcaption class="lightbox-caption" id="lightboxCaption"></figcaption>
        </figure>
        <button class="lightbox-next" id="lightboxNext" aria-label="Next photo"><i class="fas fa-chevron-right"></i></button>
